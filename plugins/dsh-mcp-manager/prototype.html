<title>PROTOTYPE — dsh-mcp-manager</title>
<!--
Throwaway prototype, not the plugin.
Chosen interaction: plugin detail, a server list that expands downward. No side drawer.
Stdio confirms on enable, and again when command/args/cwd of an enabled server change.

<style>

  .fold { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--label-3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .fold:hover { background: var(--hover); color: var(--label); }
  .fold[aria-expanded="true"] .chevron, .config-fold[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  .config-fold { display: flex; align-items: center; gap: 6px; width: 100%; height: 36px; margin-top: 4px; padding: 0; border: 0; background: transparent; color: var(--label-2); font-size: 13px; cursor: pointer; }
  .config-fold:hover { color: var(--label); }
  .expand { padding: 0 4px 8px 4px; }
  body[data-theme="dark"] .btn.primary { background: #f9fafb; color: #0f1115; }
  body[data-theme="dark"] .btn.primary:hover:not(:disabled) { background: #e1e5ee; }
  body[data-theme="dark"] .switch[aria-checked="true"] { background: #f9fafb; }
  body[data-theme="dark"] .switch[aria-checked="true"] .thumb { background: #232324; }
  body[data-theme="dark"] .summary-wrap, body[data-theme="dark"] .server.open, body[data-theme="dark"] .field + .field { border-color: #ffffff1f; }
</style>

};
function t(key, vars) {
  const pack = messages[state.locale] || messages.en;
  let text = pack[key] || messages.en[key] || key;
  if (vars) Object.keys(vars).forEach(function (name) { text = text.split("{" + name + "}").join(String(vars[name])); });
  return text;
}
const state = {
  theme: "light",
  locale: "zh-CN",
  expanded: "github",
  configOpen: "",
  confirm: null,
  pendingDelete: null,
  importOpen: false,
  importText: "",
  note: "",
  servers: [
    serverSeed("github", "stdio", true, "connected", ["list_repos", "get_file", "search_code", "create_issue", "update_file", "list_commits"], { command: "npx", args: ["-y", "@modelcontextprotocol/server-github"], env: [{ name: "GITHUB_TOKEN", set: true }] }),
    serverSeed("docs", "streamable-http", true, "failed", [], { url: "https://docs.example/mcp", headers: [{ name: "Authorization", set: true }], error: "连接超时。地址和请求头已打码。" }),
    serverSeed("files", "stdio", false, "disabled", [], { command: "node", args: ["./mcp/files.js", "/Users/xing/My Documents"] }),
    serverSeed("sentry", "streamable-http", true, "connected", ["list_issues"], { url: "https://mcp.example/mcp", external: true })
  ]

function serverSeed(name, transport, enabled, status, tools, extra) {
  const item = Object.assign({
    id: name, serverName: name, transport: transport, enabled: enabled, status: status, tools: tools,
    command: "", args: [], cwd: "", url: "", env: [], headers: [],
    external: false, error: ""

  item.applied = { command: item.command, args: Array.isArray(item.args) ? item.args.slice() : [], cwd: item.cwd || "" };
  return item;
}
function findServer(id) {
  return state.servers.find(function (item) { return item.id === id; });
}
function serverNameOf(item) {
  return String(item && item.serverName || "").trim();
}
function nameClash(name, exceptId) {
  return state.servers.some(function (other) {
    return other.id !== exceptId && serverNameOf(other) === name;
  });
}
function nameIssue(item) {
  const name = serverNameOf(item);
  if (!name) return "empty";
  if (!/^[A-Za-z0-9_-]{1,32}$/.test(name)) return "invalid";
  if (nameClash(name, item.id)) return "taken";
  return "";
}
function nameMessage(item) {
  const issue = nameIssue(item);
  if (issue === "empty") return "请先填写名称。";
  if (issue === "invalid") return "名称只能是字母、数字、下划线和短横线，1 到 32 个字符。";
  if (issue === "taken") return "已经有一台叫「" + serverNameOf(item) + "」的服务器，请换一个名称。";
  return "";
}
function argvList(item) {
  return [item.command].concat(Array.isArray(item.args) ? item.args : []);
}
function launchOf(item) {
  return { command: item.command || "", args: Array.isArray(item.args) ? item.args.slice() : [], cwd: item.cwd || "" };

    const summary = el("button", { class: "disclosure", type: "button" });

    const name = el("span", { class: "name", text: item.serverName || "未命名" });
    if (item.external) name.append(el("span", { class: "tag", text: "外部" }));
    summary.append(
      el("span", { class: "who" }, name, el("span", { class: "sub", text: item.transport })),
      statusNode(item),
      toolLine(item)
    );
    summary.addEventListener("click", function () { toggleRow(item, open); });
    const remove = button("删除", "danger sm", function () { askDelete(item); }, item.external);
    if (item.external) remove.title = "外部配置不能在这里删除";
    const fold = el("button", { class: "fold", type: "button", "aria-label": open ? "收起" : "展开" });
    fold.setAttribute("aria-expanded", open ? "true" : "false");
    fold.append(el("span", { class: "chevron" }, chevron()));
    fold.addEventListener("click", function (event) {
      event.stopPropagation();
      toggleRow(item, open);
    });
    const row = el("div", { class: open ? "server open" : "server" }, el("div", { class: "summary-wrap" }, summary, remove, toggle(item), fold));
    if (open) row.append(el("div", { class: "expand" }, toolsField(item), configSection(item)));
    list.append(row);
  });
  const page = el("div", { class: "page" },
    pluginHead(),
    el("div", { class: "toolbar" },
      button(t("add"), "primary", addServer),
      button(t("import"), "outline", function () { state.importOpen = !state.importOpen; render(); }),
      el("span", { class: "spacer" }),
      el("span", { class: "count", text: t("count", { total: state.servers.length, enabled: enabled }) })
    ),
    importBox(),
    list
  );
  const dialog = confirmDialog() || deleteDialog();
  if (dialog) page.append(dialog);
  return page;
}
function snapshot(extra) {
  return Object.assign({
    expanded: state.expanded,
    confirm: state.confirm ? state.confirm.reason : null,
    importOpen: state.importOpen,
    servers: state.servers.map(function (item) {
      return {
        serverName: item.serverName,
        transport: item.transport,
        enabled: item.enabled,
        status: item.status,
        external: item.external,
        args: item.args,
        cwd: item.cwd || "",
        env: (item.env || []).map(function (row) { return { name: row.name, set: !!row.set }; }),
        headers: (item.headers || []).map(function (row) { return { name: row.name, set: !!row.set }; }),
        launchChanged: launchChanged(item)
      };
    })
  }, extra || {});
}
function toolLine(item) {
  const line = el("span", { class: "tool-line" });
  line.setAttribute("data-tool-line", "");
  item.tools.forEach(function (name) {
    const chip = el("code", { text: name, title: "mcp__" + (item.serverName || "server") + "__" + name });
    chip.setAttribute("data-chip", "");
    line.append(chip);
  });
  const more = el("button", { class: "tool-more", type: "button", text: "更多" });
  more.hidden = true;
  more.setAttribute("data-more", "");
  const menu = el("span", { class: "more-menu" });
  menu.hidden = true;
  menu.setAttribute("data-more-menu", "");
  more.addEventListener("click", function (event) {
    event.stopPropagation();
    state.expanded = item.id;
    state.configOpen = "";
    render();
  });
  menu.addEventListener("click", function (event) { event.stopPropagation(); });
  line.append(more, menu);
  return line;
}
function fitTools() {
  document.querySelectorAll("[data-tool-line]").forEach(function (line) {
    const more = line.querySelector("[data-more]");
    const menu = line.querySelector("[data-more-menu]");
    const chips = Array.from(line.querySelectorAll("[data-chip]"));
    const menuOpen = menu && !menu.hidden;
    chips.forEach(function (chip) { chip.hidden = false; });
    if (more) more.hidden = true;
    if (!chips.length || line.scrollWidth <= line.clientWidth + 1) {
      if (menu) menu.replaceChildren();
      return;
    }
    more.hidden = false;
    const hidden = [];
    for (let i = chips.length - 1; i >= 0; i -= 1) {
      if (line.scrollWidth <= line.clientWidth + 1) break;
      chips[i].hidden = true;
      hidden.unshift(chips[i].textContent);
    }
    if (menu && !menuOpen) {
      menu.replaceChildren.apply(menu, hidden.map(function (name) { return el("code", { text: name }); }));
    }
  });
}
function toggleRow(item, open) {
  if (open) {
    state.expanded = "";
    if (state.configOpen === item.id) state.configOpen = "";
  } else {
    state.expanded = item.id;
    state.configOpen = "";
  }
  render();
}
function configSection(item) {
  const editing = state.configOpen === item.id;
  const head = el("button", { class: "config-fold", type: "button" });
  head.setAttribute("aria-expanded", editing ? "true" : "false");
  head.append(el("span", { class: "chevron" }, chevron()), "编辑连接");
  head.addEventListener("click", function () {
    state.configOpen = editing ? "" : item.id;
    render();
  });
  const box = el("div", null, head);
  if (!editing) return box;
  if (item.enabled && launchChanged(item)) box.append(el("p", { class: "warn", text: "command、args 或 cwd 已改。保存或重连前会先确认。" }));
  box.append(
    fields(item),
    el("div", { class: "form-actions" },
      button("重启", "outline", function () { restartServer(item); }),
      button("删除", "danger sm", function () { askDelete(item); }, item.external),
      button("保存", "primary", function () { saveServer(item); }, item.external)
    )
  );
  return box;
}
function paintDump(extra) {
  document.getElementById("dump").textContent = JSON.stringify(snapshot(extra), null, 2);
}
function render() {
  disarmModal();
  document.body.dataset.theme = state.theme;
  document.documentElement.lang = state.locale;
  document.getElementById("locale").textContent = state.locale;
  document.getElementById("app").replaceChildren(viewList());
  document.getElementById("label").innerHTML = "列表展开<small>点一行，在下面编辑。没有侧边抽屉。</small>";
  paintDump();
  requestAnimationFrame(fitTools);
}
document.addEventListener("click", function () {
  document.querySelectorAll("[data-more-menu]").forEach(function (menu) { menu.hidden = true; });
});
window.addEventListener("resize", fitTools);
document.getElementById("locale").addEventListener("click", function () {
  const index = locales.indexOf(state.locale);
  state.locale = locales[(index + 1) % locales.length];
  render();
});
document.getElementById("theme").addEventListener("click", function () {
  state.theme = state.theme === "light" ? "dark" : "light";
  render();
});
render();

</script>
</body>
