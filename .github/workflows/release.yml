name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-main:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tagged commit to be on origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "refusing to release: $GITHUB_SHA is not on origin/main" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA on main"

  build:
    name: ${{ matrix.name }}
    needs: verify-main
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            os: macos-14
            goos: darwin
            goarch: arm64
          - name: darwin-amd64
            os: macos-13
            goos: darwin
            goarch: amd64
          - name: linux-amd64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux WebView build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'windows' && '0' || '1' }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ./scripts/build.sh "$ver"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          arch="${{ matrix.goarch }}"
          os="${{ matrix.goos }}"
          case "$os" in
            darwin)
              ditto -c -k --keepParent "dist/Deepseek Harness Desktop.app" \
                "release/deepseek-harness-desktop-darwin-${arch}.zip"
              # build.sh already wrote a DMG under dist/; copy or recreate.
              if [ -f "dist/deepseek-harness-desktop-darwin-${arch}.dmg" ]; then
                cp "dist/deepseek-harness-desktop-darwin-${arch}.dmg" \
                  "release/deepseek-harness-desktop-darwin-${arch}.dmg"
              else
                sh scripts/package-darwin-dmg.sh "dist/Deepseek Harness Desktop.app" \
                  "release/deepseek-harness-desktop-darwin-${arch}.dmg"
              fi
              ;;
            linux)
              cp dist/deepseek-harness-desktop "release/deepseek-harness-desktop-linux-${arch}"
              chmod 755 "release/deepseek-harness-desktop-linux-${arch}"
              ;;
            windows)
              cp dist/deepseek-harness-desktop.exe "release/deepseek-harness-desktop-windows-${arch}.exe"
              ;;
            *)
              echo "unsupported GOOS=$os" >&2
              exit 1
              ;;
          esac
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List artifacts
        run: ls -la release

      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          sha256sum * | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
