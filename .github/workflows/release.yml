name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-main:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tagged commit to be on origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "refusing to release: $GITHUB_SHA is not on origin/main" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA on main"

  verify:
    name: Contract tests
    needs: verify-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go race tests
        run: go test -race ./...
      - name: Run Node bridge and WebView contracts
        run: |
          node internal/dsh/desktopbridge/client_test.mjs
          node internal/dsh/desktopbridge/copy_session_menu_test.mjs
          node internal/dsh/webviewboot/hook_test.mjs

  build:
    name: ${{ matrix.name }}
    needs: [verify-main, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 (Intel) is retired/scarce. Build both Darwin arches on
          # macos-15 (arm64 host): Go+CGO can target amd64 with the macOS SDK.
          - name: darwin-arm64
            os: macos-15
            goos: darwin
            goarch: arm64
          - name: darwin-amd64
            os: macos-15
            goos: darwin
            goarch: amd64
          - name: linux-amd64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
          # Wails Windows builds use CGO_ENABLED=0, so arm64 can cross-compile
          # on the amd64 runner without a Windows ARM host.
          - name: windows-arm64
            os: windows-latest
            goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux WebView build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'windows' && '0' || '1' }}
          DSH_UPDATE_MANIFEST_PUBLIC_KEY: ${{ vars.DSH_UPDATE_MANIFEST_PUBLIC_KEY }}
          DSH_REQUIRE_SIGNED_UPDATES: "1"
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          # Cross-arch Darwin on Apple Silicon runners: pin clang to the target.
          if [ "${{ matrix.goos }}" = "darwin" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            export CGO_CFLAGS="${CGO_CFLAGS:-} -arch x86_64"
            export CGO_LDFLAGS="${CGO_LDFLAGS:-} -arch x86_64"
          fi
          if [ "${{ matrix.goos }}" = "darwin" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            export CGO_CFLAGS="${CGO_CFLAGS:-} -arch arm64"
            export CGO_LDFLAGS="${CGO_LDFLAGS:-} -arch arm64"
          fi
          ./scripts/build.sh "$ver"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          arch="${{ matrix.goarch }}"
          os="${{ matrix.goos }}"
          case "$os" in
            darwin)
              ditto -c -k --keepParent "dist/Deepseek Harness Desktop.app" \
                "release/deepseek-harness-desktop-darwin-${arch}.zip"
              # build.sh already wrote a DMG under dist/; copy or recreate.
              if [ -f "dist/deepseek-harness-desktop-darwin-${arch}.dmg" ]; then
                cp "dist/deepseek-harness-desktop-darwin-${arch}.dmg" \
                  "release/deepseek-harness-desktop-darwin-${arch}.dmg"
              else
                sh scripts/package-darwin-dmg.sh "dist/Deepseek Harness Desktop.app" \
                  "release/deepseek-harness-desktop-darwin-${arch}.dmg"
              fi
              ;;
            linux)
              cp dist/deepseek-harness-desktop "release/deepseek-harness-desktop-linux-${arch}"
              chmod 755 "release/deepseek-harness-desktop-linux-${arch}"
              ;;
            windows)
              cp dist/deepseek-harness-desktop.exe "release/deepseek-harness-desktop-windows-${arch}.exe"
              ;;
            *)
              echo "unsupported GOOS=$os" >&2
              exit 1
              ;;
          esac
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Signed per-target manifests
        shell: bash
        env:
          DSH_UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.DSH_UPDATE_MANIFEST_PRIVATE_KEY }}
          DSH_UPDATE_MANIFEST_SIGNER: ${{ vars.DSH_UPDATE_MANIFEST_SIGNER }}
        run: |
          set -euo pipefail
          if [ -z "${DSH_UPDATE_MANIFEST_PRIVATE_KEY:-}" ]; then
            echo "DSH_UPDATE_MANIFEST_PRIVATE_KEY is required to publish a signed update manifest" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/dsh-update-ed25519.key"
          printf '%s' "$DSH_UPDATE_MANIFEST_PRIVATE_KEY" > "$key_file"
          version="${GITHUB_REF_NAME#v}"
          for artifact in release/deepseek-harness-desktop-*; do
            name="$(basename "$artifact")"
            case "$name" in
              deepseek-harness-desktop-darwin-arm64.zip) goos=darwin; goarch=arm64 ;;
              deepseek-harness-desktop-darwin-amd64.zip) goos=darwin; goarch=amd64 ;;
              deepseek-harness-desktop-linux-arm64) goos=linux; goarch=arm64 ;;
              deepseek-harness-desktop-linux-amd64) goos=linux; goarch=amd64 ;;
              deepseek-harness-desktop-windows-arm64.exe) goos=windows; goarch=arm64 ;;
              deepseek-harness-desktop-windows-amd64.exe) goos=windows; goarch=amd64 ;;
              *) continue ;;
            esac
            go run ./tools/update-manifest \
              -artifact "$artifact" \
              -out "release/manifest-${goos}-${goarch}.json" \
              -version "$version" -goos "$goos" -goarch "$goarch" \
              -key-file "$key_file" \
              -signer "${DSH_UPDATE_MANIFEST_SIGNER:-release-ed25519-v1}"
          done
          rm -f "$key_file"

      - name: List artifacts
        run: ls -la release

      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          sha256sum * | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: false
          fail_on_unmatched_files: true
