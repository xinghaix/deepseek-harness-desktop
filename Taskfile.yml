version: '3'

vars:
  TARGET_OS: '{{.GOOS | default OS}}'
  TARGET_ARCH: '{{.GOARCH | default ARCH}}'
  DIST: dist
  APP: deepseek-harness-desktop

tasks:
  icons:
    summary: 生成统一 SVG、PNG、ICNS、ICO 和 Linux 图标主题资源
    cmds:
      - go run ./tools/icons

  build:
    summary: Build the Deepseek Harness Desktop binary for the selected platform
    cmds:
      - task: '{{.TARGET_OS}}:build'

  test:
    summary: Run process, UI contract, and Wails-tagged desktop tests
    cmds:
      - go test -race ./...
      - go test -race -tags wails ./...

  linux:build:
    summary: Build the Linux Deepseek Harness Desktop binary
    cmds:
      - mkdir -p {{.DIST}}
      - go build -tags '{{.BUILD_TAGS}}' -trimpath -buildvcs=false -o {{.DIST}}/{{.APP}} .
      - sh scripts/sign.sh {{.DIST}}/{{.APP}}
    vars:
      BUILD_TAGS: '{{if .EXTRA_TAGS}}wails,{{.EXTRA_TAGS}}{{else}}wails{{end}}'
    env:
      GOOS: linux
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '1'

  darwin:build:
    summary: Build the macOS Deepseek Harness Desktop binary and app bundle
    cmds:
      - mkdir -p {{.DIST}}
      - go build -tags '{{.BUILD_TAGS}}' -trimpath -buildvcs=false -o {{.DIST}}/{{.APP}} .
      - rm -rf {{.DIST}}/{{.APP}}.app
      - mkdir -p {{.DIST}}/{{.APP}}.app/Contents/{MacOS,Resources/plugins}
      - go run ./tools/icons
      - cp {{.DIST}}/{{.APP}} {{.DIST}}/{{.APP}}.app/Contents/MacOS/{{.APP}}
      - cp assets/darwin/icons.icns {{.DIST}}/{{.APP}}.app/Contents/Resources/icons.icns
      - cp assets/darwin/Info.plist {{.DIST}}/{{.APP}}.app/Contents/Info.plist
      - cp -R plugins/deepseek-harness-desktop-bridge {{.DIST}}/{{.APP}}.app/Contents/Resources/plugins/deepseek-harness-desktop-bridge
      - chmod 755 {{.DIST}}/{{.APP}}.app/Contents/MacOS/{{.APP}}
      - sh scripts/sign.sh {{.DIST}}/{{.APP}}.app
      - sh scripts/package-darwin-dmg.sh {{.DIST}}/{{.APP}}.app {{.DIST}}/{{.APP}}-darwin-{{.TARGET_ARCH}}.dmg
    vars:
      BUILD_TAGS: '{{if .EXTRA_TAGS}}wails,{{.EXTRA_TAGS}}{{else}}wails{{end}}'
    env:
      GOOS: darwin
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '1'

  windows:build:
    summary: Build the Windows Deepseek Harness Desktop binary
    cmds:
      - mkdir -p {{.DIST}}
      - go build -tags '{{.BUILD_TAGS}}' -trimpath -buildvcs=false -o {{.DIST}}/{{.APP}}.exe .
      - cmd: sh scripts/sign.sh {{.DIST}}/{{.APP}}.exe
        platforms: [linux, darwin]
      - cmd: powershell -ExecutionPolicy Bypass -File scripts/sign-windows.ps1 {{.DIST}}/{{.APP}}.exe
        platforms: [windows]
    vars:
      BUILD_TAGS: '{{if .EXTRA_TAGS}}wails,{{.EXTRA_TAGS}}{{else}}wails{{end}}'
    env:
      GOOS: windows
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '0'
