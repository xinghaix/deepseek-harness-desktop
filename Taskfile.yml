version: '3'

vars:
  TARGET_OS: '{{.GOOS | default OS}}'
  TARGET_ARCH: '{{.GOARCH | default ARCH}}'

tasks:
  build:
    summary: Build the Deepseek Harness Desktop binary for the selected platform
    cmds:
      - task: '{{.TARGET_OS}}:build'

  test:
    summary: Run the dependency-free process and UI contract tests
    cmds:
      - go test -race ./...

  linux:build:
    summary: Build the Linux Deepseek Harness Desktop binary
    cmds:
      - go build -tags '{{.BUILD_TAGS}}' -trimpath -buildvcs=false -o bin/deepseek-harness-desktop .
    vars:
      BUILD_TAGS: '{{if .EXTRA_TAGS}}wails,{{.EXTRA_TAGS}}{{else}}wails{{end}}'
    env:
      GOOS: linux
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '1'

  darwin:build:
    summary: Build the macOS Deepseek Harness Desktop binary and app bundle
    cmds:
      - go build -tags '{{.BUILD_TAGS}}' -trimpath -buildvcs=false -o bin/deepseek-harness-desktop .
      - rm -rf bin/deepseek-harness-desktop.app
      - mkdir -p build/darwin build/windows bin/deepseek-harness-desktop.app/Contents/{MacOS,Resources}
      - wails3 generate icons -input build/appicon.png -macfilename build/darwin/icons.icns -windowsfilename build/windows/icon.ico
      - cp bin/deepseek-harness-desktop bin/deepseek-harness-desktop.app/Contents/MacOS/deepseek-harness-desktop
      - cp build/darwin/icons.icns bin/deepseek-harness-desktop.app/Contents/Resources/icons.icns
      - cp build/darwin/Info.plist bin/deepseek-harness-desktop.app/Contents/Info.plist
      - mkdir -p bin/deepseek-harness-desktop.app/Contents/Resources/plugins
      - cp -R plugins/deepseek-harness-desktop-bridge bin/deepseek-harness-desktop.app/Contents/Resources/plugins/deepseek-harness-desktop-bridge
      - chmod 755 bin/deepseek-harness-desktop.app/Contents/MacOS/deepseek-harness-desktop
    vars:
      BUILD_TAGS: '{{if .EXTRA_TAGS}}wails,{{.EXTRA_TAGS}}{{else}}wails{{end}}'
    env:
      GOOS: darwin
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '1'

  windows:build:
    summary: Build the Windows Deepseek Harness Desktop binary
    cmds:
      - go build -tags '{{.BUILD_TAGS}}' -trimpath -buildvcs=false -o bin/deepseek-harness-desktop.exe .
    vars:
      BUILD_TAGS: '{{if .EXTRA_TAGS}}wails,{{.EXTRA_TAGS}}{{else}}wails{{end}}'
    env:
      GOOS: windows
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '0'
